name: APK Android

# Compila la app de Android en cada cambio y publica el APK en
# "Releases" (etiqueta android-latest) para descargarlo desde el teléfono.
on:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npm run build:web && npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk MusicaDJ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MusicaDJ-apk
          path: MusicaDJ.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Musica DJ para Android
          body: |
            Última versión de la app (compilación ${{ github.run_number }}, rama `${{ github.ref_name }}`).

            **Instalar:** descarga `MusicaDJ.apk` desde el teléfono, ábrelo y permite "instalar apps de esta fuente" si Android lo pide.
            Las versiones nuevas se instalan encima de la anterior sin perder la biblioteca.
          files: MusicaDJ.apk
          make_latest: true
